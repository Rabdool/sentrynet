<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SentryNet — Sign in</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #0f1419; color: #e6e6e6;
           min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
    .card { background: #161c24; border: 1px solid #222a33; border-radius: 10px; padding: 28px; width: 100%; max-width: 340px; box-sizing: border-box; }
    h1 { margin: 0; font-size: 20px; }
    .sub { color: #8a97a5; font-size: 13px; margin-bottom: 20px; }
    label { display: block; font-size: 12px; color: #8a97a5; text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 6px; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 6px;
           border: 1px solid #2a333d; background: #0f1419; color: #e6e6e6; font-size: 15px; }
    button { margin-top: 20px; width: 100%; background: #1f6feb; color: #fff; border: 0; border-radius: 6px; padding: 10px; cursor: pointer; font-size: 15px; }
    .error { background: #3a1416; color: #ff7a85; border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="{{ url_for('login') }}">
    <h1>SentryNet</h1>
    <div class="sub">Administrator sign-in</div>
    {% for message in get_flashed_messages() %}
      <div class="error">{{ message }}</div>
    {% endfor %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
