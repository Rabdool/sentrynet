<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SentryNet — Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='sentrynet.css') }}">
</head>
<body class="auth-page">
  <div class="radar backdrop" aria-hidden="true"><div class="sweep"></div></div>

  <form class="auth-card hud" method="post" action="{{ url_for('login') }}">
    <svg class="shield" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><rect x="9" y="11" width="6" height="5" rx="1"/><path d="M10 11V9.5a2 2 0 0 1 4 0V11"/>
    </svg>
    <h1 class="brand">SentryNet</h1>
    <div class="sub">Administrator sign-in</div>

    {% for message in get_flashed_messages() %}
      <div class="error" role="alert">{{ message }}</div>
    {% endfor %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="field">
      <label for="username">Username</label>
      <div class="input-wrap">
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap has-toggle">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="toggle-pw" aria-label="Show password" aria-pressed="false" aria-controls="password">
          <svg class="eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-primary">Sign in</button>

    <div class="auth-foot">Authorized personnel only · All access is logged</div>
  </form>

  <script>
    document.querySelector(".toggle-pw").addEventListener("click", function () {
      var input = document.getElementById("password");
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      this.setAttribute("aria-pressed", String(show));
      this.setAttribute("aria-label", show ? "Hide password" : "Show password");
      input.focus();
    });
  </script>
</body>
</html>
